name: CI/CD Deployment - Self-Hosted VM (Kind, No Registry)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  CONSUMER_IMAGE: post-consumer:latest
  PUSHER_IMAGE: post-pusher-kafka:latest
  SA_SECRET_NAME: gcp-sa-secret
  KIND_CLUSTER_NAME: devops-kind-cluster

# =========================================================
# JOB 1 — BUILD
# =========================================================
jobs:
  build:
    name: Build Docker Images
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Consumer Image
        run: |
          docker build \
            -t ${{ env.CONSUMER_IMAGE }} \
            -f post_consumer/Dockerfile \
            post_consumer

      - name: Build Pusher Image
        run: |
          docker build \
            -t ${{ env.PUSHER_IMAGE }} \
            -f post_pusher/Dockerfile \
            post_pusher

# =========================================================
# JOB 2 — DEPLOY
# =========================================================
  deploy:
    name: Deploy to Kind Cluster
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------- KIND CLUSTER ----------
      - name: Setup Kind Cluster
        run: |
          if kind get clusters | grep -q "${{ env.KIND_CLUSTER_NAME }}"; then
            echo "Cluster Kind déjà existant"
          else
            kind create cluster \
              --name ${{ env.KIND_CLUSTER_NAME }} \
              --config ./kind/config.yaml
          fi

          KIND_KUBECONFIG=$(kind get kubeconfig --name ${{ env.KIND_CLUSTER_NAME }} --internal)
          CONTROL_PLANE_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${{ env.KIND_CLUSTER_NAME }}-control-plane")
          FIXED_KUBECONFIG=$(echo "$KIND_KUBECONFIG" | sed "s/server: https:\/\/.*/server: https:\/\/$CONTROL_PLANE_IP:6443/")

          echo "KUBECONFIG_CONTEXT<<EOF" >> $GITHUB_ENV
          echo "$FIXED_KUBECONFIG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ env.KUBECONFIG_CONTEXT }}

      # ---------- LOAD IMAGES ----------
      - name: Load Images into Kind
        run: |
          kind load docker-image ${{ env.CONSUMER_IMAGE }} --name ${{ env.KIND_CLUSTER_NAME }}
          kind load docker-image ${{ env.PUSHER_IMAGE }} --name ${{ env.KIND_CLUSTER_NAME }}

      - name: Wait for Nodes
        run: kubectl wait --for=condition=ready node --all --timeout=300s

      # ---------- SECRETS ----------
      - name: Create / Update GCP Service Account Secret
        run: |
          echo '${{ secrets.SA_JSON }}' | tr -d '\n\r' > sa-gcp.json

          kubectl create secret generic ${{ env.SA_SECRET_NAME }} \
            --from-file=service-account.json=sa-gcp.json \
            --namespace=default \
            --dry-run=client -o yaml | kubectl apply -f -

          rm sa-gcp.json

      # ---------- MONGODB ----------
      - name: Deploy MongoDB
        run: |
          kubectl apply -f MongoDB/secret.yaml
          kubectl apply -f MongoDB/service.yaml
          kubectl apply -f MongoDB/statefulset.yaml

      - name: Wait for MongoDB
        run: kubectl wait --for=condition=ready pod/mongodb-0 --timeout=180s

      # ---------- KAFKA ----------
      - name: Deploy Kafka & UI
        run: |
          kubectl apply -f kafka/configmap.yaml
          kubectl apply -f kafka/service.yaml
          kubectl apply -f kafka/deployment.yaml
          kubectl apply -f ui/configmap.yaml
          kubectl apply -f ui/service.yaml
          kubectl apply -f ui/deployment.yaml

      - name: Wait for Kafka
        run: kubectl rollout status deployment/kafka-broker --timeout=180s

      # ---------- APPLICATIONS ----------
      - name: Deploy Applications
        run: |
          kubectl apply -f post_pusher/deployment.yaml
          kubectl apply -f post_consumer/configmap.yaml
          kubectl apply -f post_consumer/deployment.yaml

      - name: Wait for Applications
        run: |
          kubectl rollout status deployment/post-pusher-kafka --timeout=120s
          kubectl rollout status deployment/post-consumer --timeout=120s

# =========================================================
# JOB 3 — TEST
# =========================================================
  test:
    name: Integration & Smoke Tests
    runs-on: self-hosted
    needs: deploy

    steps:
      - name: Kubernetes Status
        run: |
          kubectl get pods -o wide
          kubectl get services
          kubectl get deployments
          kubectl get statefulsets

      - name: MongoDB Smoke Test
        run: |
          kubectl exec mongodb-0 -- \
            mongosh --eval "db.adminCommand('ping')"

      - name: Kafka Smoke Test
        run: |
          kubectl get svc | grep kafka

      - name: Application Rollout Check
        run: |
          kubectl rollout status deployment/post-consumer
          kubectl rollout status deployment/post-pusher-kafka

      - name: Pipeline Success
        run: echo "✅ Build, Deploy & Tests réussis"
